name: Update music news

# Runs scraper/music_news.py once a day and commits the refreshed
# data/music-news.json (read by news.html) and data/music-news.md.
on:
  schedule:
    - cron: "17 12 * * *" # daily at 12:17 UTC (morning in the US)
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: music-news
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s scraper/tests

      # Exits non-zero only if every feed fails, so a total outage never
      # overwrites the last good data with an empty page.
      - name: Scrape music news
        run: python scraper/music_news.py

      - name: Commit updated news
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update music news ($(date -u +%Y-%m-%d))"
          git push
